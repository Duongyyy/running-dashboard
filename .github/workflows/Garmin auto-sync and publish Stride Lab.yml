name: Stride Lab — Garmin auto-sync and publish

on:
  workflow_dispatch:
  schedule:
    # Every ~6 hours. GitHub Actions may delay scheduled runs.
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stride-lab-main-sync
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check files are in repository's main folder
        run: |
          set -euo pipefail
          for file in cloud_sync.py public_export.py requirements.txt server/__init__.py server/garmin.py server/metrics.py server/storage.py server/fit_reader.py site_assets/index.html site_assets/app.js site_assets/style.css; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file at the root of the repository."
              echo "In GitHub, use Add file > Upload files from the MAIN Code page."
              exit 1
            fi
          done
          echo 'All dashboard source files are present.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python imports and application tests
        run: |
          python -c 'from server.garmin import GarminPersonal; from server.metrics import dashboard; from public_export import sanitized; print("Stride Lab imports verified")'
          python -m unittest discover -s tests -v

      - name: Recover previous encrypted history if present
        shell: bash
        run: |
          if [ ! -f state/history.enc ] && [ -f Stride-Lab-Free-AutoSync-GitHub/state/history.enc ]; then
            mkdir -p state
            cp Stride-Lab-Free-AutoSync-GitHub/state/history.enc state/history.enc
            echo 'Existing encrypted Garmin history carried forward.'
          fi

      - name: Sync Garmin and generate read-only website
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          STRIDE_ARCHIVE_KEY: ${{ secrets.STRIDE_ARCHIVE_KEY }}
          PUBLISH_PHYSIOLOGY: ${{ vars.PUBLISH_PHYSIOLOGY }}
          PUBLISH_ACTIVITY_SUMMARIES: ${{ vars.PUBLISH_ACTIVITY_SUMMARIES }}
          DETAIL_BATCH: '60'
        run: python cloud_sync.py

      - name: Commit ONLY the encrypted activity archive
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state/history.enc
          if ! git diff --cached --quiet; then
            git commit -m 'Update encrypted Garmin history [skip ci]'
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Publish website
        id: publish
        uses: actions/deploy-pages@v4
