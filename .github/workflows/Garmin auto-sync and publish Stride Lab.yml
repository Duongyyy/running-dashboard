name: Garmin auto-sync and publish Stride Lab

on:
  schedule:
    # UTC: around every six hours; GitHub scheduling may be delayed.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: garmin-sync-pages
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Find dashboard files
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t found < <(find . -type f -name cloud_sync.py -not -path './.git/*' | sort)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "Expected exactly one cloud_sync.py, found ${#found[@]}." >&2
            printf '%s\n' "${found[@]}" >&2
            echo "Please upload one complete Stride Lab project, including requirements.txt." >&2
            exit 1
          fi
          project_dir="$(dirname "${found[0]}")"
          if [ ! -f "$project_dir/requirements.txt" ]; then
            echo "Missing $project_dir/requirements.txt" >&2
            echo "Upload requirements.txt into the same directory as cloud_sync.py." >&2
            exit 1
          fi
          echo "path=$project_dir" >> "$GITHUB_OUTPUT"
          echo "STRIDE_APP_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Located Stride Lab at: $project_dir"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r "$STRIDE_APP_DIR/requirements.txt"

      - name: Sync Garmin and build safe public site
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          STRIDE_ARCHIVE_KEY: ${{ secrets.STRIDE_ARCHIVE_KEY }}
          PUBLISH_PHYSIOLOGY: ${{ vars.PUBLISH_PHYSIOLOGY }}
          PUBLISH_ACTIVITY_SUMMARIES: ${{ vars.PUBLISH_ACTIVITY_SUMMARIES }}
          DETAIL_BATCH: '60'
        run: |
          cd "$STRIDE_APP_DIR"
          python cloud_sync.py

      - name: Save encrypted history (never plaintext)
        run: |
          git config user.name 'stride-lab-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- "$STRIDE_APP_DIR/state/history.enc"
          if ! git diff --cached --quiet; then
            git commit -m 'Update encrypted Garmin sync state [skip ci]'
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.locate.outputs.path }}/site

      - name: Publish GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
